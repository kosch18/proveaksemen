services:

  postgres:
    image: postgres:16-alpine
    container_name: nordic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nordic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nordic_devices}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nordic} -d ${POSTGRES_DB:-nordic_devices}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to host — only accessible inside Docker network

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-nordic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nordic_devices}?schema=public
        AUTH_SECRET: ${AUTH_SECRET}
    container_name: nordic-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nordic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nordic_devices}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nordic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: nordic-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

volumes:
  postgres_data:
  uploads_data:
  certbot_www:
  certbot_certs:
